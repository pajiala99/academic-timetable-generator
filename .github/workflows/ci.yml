name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: mvn test (JDK 17, DAOs on H2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Solver, CSV export and DAO tests
        run: ./mvnw -B -ntp test

  mysql:
    # The suite above runs the DAOs on H2 in MySQL compatibility mode. This job runs
    # the same DataStoreTest against a real MySQL server, the app's primary database.
    name: DAOs on MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          # Throwaway credentials for a container that only exists during this job.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: timetable_test
          MYSQL_USER: timetable
          MYSQL_PASSWORD: timetable
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: DataStoreTest on MySQL (wipes timetable_test before every test)
        run: >-
          ./mvnw -B -ntp test -Dtest=DataStoreTest
          -Dtest.mysql.url="jdbc:mysql://127.0.0.1:3306/timetable_test?useSSL=false&allowPublicKeyRetrieval=true"
          -Dtest.mysql.user=timetable -Dtest.mysql.password=timetable
